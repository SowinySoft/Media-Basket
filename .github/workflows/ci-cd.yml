name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # PostgreSQL (using the same setup as local development)
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5433
  POSTGRES_DB: media_basket
  POSTGRES_USER: postgres
  # For Windows local testing, we use the fresh PostgreSQL 18 cluster
  DATABASE_URL: postgresql+asyncpg://postgres@localhost:5433/media_basket
  DATABASE_URL_SYNC: postgresql://postgres@localhost:5433/media_basket
  # Frontend
  NEXT_PUBLIC_API_URL: http://localhost:8000
  # Testing environment
  NODE_ENV: test

jobs:
  # Backend tests
  backend:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: media_basket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -p 5433:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --only main,dev

      - name: Start PostgreSQL
        run: |
          # Start PostgreSQL with trusted authentication
          # This matches our local setup
          & "C:\\Program Files\\PostgreSQL\\18\\bin\\postgres.exe" -D "C:\pgtest" -p 5433 -c log_destination=stderr
          Start-Sleep -Seconds 5

      - name: Verify PostgreSQL is running
        run: |
          & "C:\Program Files\PostgreSQL\18\bin\pg_isready.exe" -h localhost -p 5433

      - name: Create test database
        run: |
          & "C:\Program Files\PostgreSQL\18\bin\psql.exe" -h localhost -p 5433 -U postgres -d postgres -c "CREATE DATABASE media_basket_test;"

      - name: Run Alembic migrations
        run: |
          poetry run alembic upgrade head

      - name: Run pytest
        run: |
          poetry run pytest tests/ -v --tb=short

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/
          retention-days: 7

  # Frontend tests
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: media_basket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -p 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"
          sudo -u postgres createdb media_basket

      - name: Start PostgreSQL with trusted auth (alternative)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'postgres';"

      - name: Run frontend lint and typecheck
        run: |
          cd frontend
          npm run lint
          npm run typecheck

      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright install --with-deps
          npm run test:e2e

      - name: Upload frontend test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/playwright-report/
          retention-days: 7

  # Database migration validation
  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: media_basket
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -p 5432:5432
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --only main

      - name: Validate migrations
        run: |
          poetry run alembic history
          poetry run alembic current
          poetry run alembic check

      - name: Test database migrations
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base
          poetry run alembic upgrade head
          poetry run alembic current

  # Security scan
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run safety audit
        run: |
          pip install safety
          safety check

      - name: Run Bandit (Python security scanner)
        run: |
          pip install bandit
          bandit -r backend/app -f json -o bandit-report.json

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
          retention-days: 7

  # Deploy to staging (manual trigger)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, migration-validation, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy to staging server
        run: |
          echo "Deploying to staging server"
          # Add your deployment logic here
          # Example: ssh deployment, docker compose, etc.

  # Release to production (manual trigger)
  release:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production server"
          # Add your production deployment logic here
