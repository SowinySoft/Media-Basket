apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mediabasket.fullname" . }}-config
  labels:
    {{- include "mediabasket.labels" . | nindent 4 }}
data:
  ALLOWED_HOSTS: {{ .Values.env.ALLOWED_HOSTS | quote }}
  CORS_ORIGINS: {{ .Values.env.CORS_ORIGINS | quote }}
  DEBUG: {{ .Values.env.DEBUG | quote }}
  {{- if .Values.postgres.enabled }}
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}@{{ include "mediabasket.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
  {{- else }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  REDIS_URL: "redis://{{ include "mediabasket.fullname" . }}-redis:6379/0"
  {{- else }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
  {{- end }}
