apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediabasket.fullname" . }}-backend
  labels:
    {{- include "mediabasket.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mediabasket.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mediabasket.fullname" . }}-frontend
  labels:
    {{- include "mediabasket.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "mediabasket.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
