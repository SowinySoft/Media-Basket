backend:
  image:
    repository: mediabasket/backend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  port: 8000

frontend:
  image:
    repository: mediabasket/frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 250m
  port: 3000

postgres:
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  storage: 10Gi
  database: mediabasket
  user: mediabasket

redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

ingress:
  enabled: false
  host: mediabasket.local
  tls: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPU: 70

env:
  DATABASE_URL: ""
  REDIS_URL: ""
  JWT_SECRET_KEY: ""
  SECRET_KEY: ""
  ALLOWED_HOSTS: "*"
  CORS_ORIGINS: "*"
  DEBUG: "false"
